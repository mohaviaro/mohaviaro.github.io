<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="48" fill="url(#bgGrad)" />
  
  <!-- Subtle Neural & Math Grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.2">
    <circle cx="120" cy="120" r="88" fill="none" stroke-dasharray="4 6" />
    <circle cx="120" cy="120" r="64" fill="none" />
    <path d="M 40 120 L 200 120 M 120 40 L 120 200" stroke-opacity="0.08" />
    <path d="M 63 63 L 177 177 M 63 177 L 177 63" stroke-opacity="0.06" />
  </g>

  <!-- Outer Orbiting Ring -->
  <circle cx="120" cy="120" r="94" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="160 50" filter="url(#glow)" />
  
  <!-- Math & Neural Nodes -->
  <circle cx="58" cy="85" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="182" cy="155" r="4.5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="160" cy="72" r="3.5" fill="#818cf8" />
  <circle cx="80" cy="168" r="3" fill="#22d3ee" />

  <!-- Center Badge / Shield -->
  <circle cx="120" cy="120" r="50" fill="#0f172a" stroke="url(#neonGlow)" stroke-width="2" />

  <!-- Monogram Initials "MS" -->
  <text x="120" y="130" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="1"
        fill="url(#neonGlow)"
        filter="url(#glow)">MS</text>

  <!-- Small Subtitle Accent -->
  <text x="120" y="156" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="8.5" 
        font-weight="700" 
        letter-spacing="2.5" 
        fill="#94a3b8" 
        opacity="0.85">AI • DEV • QUANT</text>
</svg>
